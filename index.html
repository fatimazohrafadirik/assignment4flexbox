<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="flexbox">
    <section class="mainsquare">
      <div class="line">
        <div class="squarebox box1">
          <span class="square1"></span>
          <span class="square1"></span>
          <span class="square1"></span>
        </div>

        <div class="squarebox box2">
          <span class="square2"></span>
          <span class="square2"></span>
          <span class="square2"></span>
        </div>
      </div>

      <div class="line">
        <div class="squarebox box3">
          <span class="square1"></span>
          <span class="square1"></span>
          <span class="square1"></span>
        </div>

        <div class="squarebox box4">
          <span class="square1"></span>
          <span class="square1"></span>

          <div class="box4-bottom">
            <span class="square1"></span>
          </div>
        </div>
      </div>

      <div class="line">
        <div class="squarebox box5">
          <span class="square3 tall"></span>
          <span class="square3 short"></span>
          <span class="square3 tall"></span>
        </div>

        <div class="squarebox box6">
          <span class="square3 small"></span>
          <span class="square3 wide"></span>
          <span class="square3 small"></span>
        </div>
      </div>
    </section>

    <section class="maincircle">
      <div class="circlebox circlebox1">
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="circlebox circlebox2">
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="circlebox circlebox3">
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="circlebox circlebox4">
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <div class="circlebox circlebox5">
        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <div class="dot-row">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </section>
  </body>
</html>
