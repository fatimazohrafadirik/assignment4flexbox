<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="flexbox">
    <div class="mainsquare">
      <div class="line">
        <div class="squarebox box1">
          <span class="square1"></span>
          <span class="square1"></span>
          <span class="square1"></span>
        </div>

        <div class="squarebox box2">
          <span class="square2"></span>
          <span class="square2"></span>
          <span class="square2"></span>
        </div>
      </div>

      <div class="line">
        <div class="squarebox box3">
          <span class="square1"></span>
          <span class="square1"></span>
          <span class="square1"></span>
        </div>

        <div class="squarebox box4">
          <!-- <div class="child1box4 child"> -->
          <span class="square1"></span>
          <span class="square1"></span>
          <!-- </div> -->
          <div class="child">
            <span class="square1"></span>
          </div>
        </div>
      </div>

      <div class="line">
        <div class="squarebox">
          <span class="square"></span>
          <span class="square"></span>
          <span class="square"></span>
        </div>

        <div class="squarebox">
          <span class="square"></span>
          <span class="square"></span>
          <span class="square"></span>
        </div>
      </div>
    </div>

    <div class="maincircle">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </body>
</html>
